<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Система безопасности</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --card: #111111;
            --border: #1a1a1a;
            --text: #ffffff;
            --secondary: #98989d;
            --red: #ff3b30;
            --green: #30d158;
            --amber: #ff9f0a;
            --blue: #0a84ff;
            --font-mono: 'SF Mono', 'Menlo', 'Courier New', monospace;
            --font-system: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            font-family: var(--font-system);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* ==================== ФОН ==================== */
        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .bg-scan {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,59,48,0.4), transparent);
            pointer-events: none;
            z-index: 0;
            animation: scanDown 3s linear infinite;
        }

        @keyframes scanDown {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* ==================== ОСНОВНОЙ КОНТЕЙНЕР ==================== */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
        }

        /* ==================== ЗАГОЛОВОК ==================== */
        .header {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            width: 36px; height: 36px;
            border-radius: 8px;
            background: #1a0000;
            border: 1px solid #3d0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(255,59,48,0); }
            50% { box-shadow: 0 0 12px rgba(255,59,48,0.3); }
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            font-size: 10px;
            color: var(--secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--red);
            font-weight: 600;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--red);
            animation: dotBlink 1s step-end infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==================== ИНФО-ПАНЕЛЬ ==================== */
        .info-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            flex-shrink: 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
        }

        .info-label {
            color: var(--secondary);
            font-size: 12px;
        }

        .info-value {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
        }

        .info-value.red { color: var(--red); }
        .info-value.green { color: var(--green); }
        .info-value.amber { color: var(--amber); }

        .info-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ==================== ОКНО ТЕРМИНАЛА ==================== */
        .terminal-window {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .terminal-header {
            background: #161616;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .terminal-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }
        .terminal-dot.red { background: #ff5f57; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #28c840; }

        .terminal-title-text {
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: var(--secondary);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        .terminal-body {
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.8;
            color: var(--text);
            -webkit-overflow-scrolling: touch;
            word-break: break-all;
        }

        .terminal-body::-webkit-scrollbar { width: 2px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

        .log-line {
            opacity: 0;
            animation: logFadeIn 0.1s ease forwards;
        }

        @keyframes logFadeIn {
            to { opacity: 1; }
        }

        .log-line .red { color: var(--red); }
        .log-line .green { color: var(--green); }
        .log-line .amber { color: var(--amber); }
        .log-line .blue { color: var(--blue); }
        .log-line .gray { color: var(--secondary); }
        .log-line .dim { opacity: 0.5; }

        .cursor-blink {
            display: inline-block;
            width: 6px; height: 13px;
            background: var(--green);
            animation: cursorAnim 1s step-end infinite;
            vertical-align: middle;
            margin-left: 3px;
        }

        @keyframes cursorAnim {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==================== ПРОГРЕСС ==================== */
        .progress-section {
            flex-shrink: 0;
            padding: 0 2px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .progress-section.visible { opacity: 1; }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--secondary);
            margin-bottom: 4px;
            font-family: var(--font-mono);
        }

        .progress-bar {
            height: 2px;
            background: #1a1a1a;
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--red);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 1px;
        }

        /* ==================== МОДАЛЬНОЕ ОКНО ==================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: overlayIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }

        @keyframes overlayIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-dialog {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 16px;
            width: 88%;
            max-width: 360px;
            padding: 28px 22px 22px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            animation: dialogIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes dialogIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-icon-wrap {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: #1a0000;
            border: 2px solid #3d0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
            animation: modalIconPulse 2s ease-in-out infinite;
        }

        @keyframes modalIconPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(255,59,48,0); }
            50% { box-shadow: 0 0 25px rgba(255,59,48,0.4); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--secondary);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-attempts {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 18px;
            font-size: 13px;
            color: var(--amber);
            font-weight: 500;
        }

        .attempt-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--amber);
            transition: all 0.3s;
        }
        .attempt-dot.used {
            background: #333;
        }

        .modal-input {
            width: 100%;
            background: #000;
            border: 2px solid #333;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 26px;
            padding: 14px 10px;
            text-align: center;
            border-radius: 12px;
            letter-spacing: 10px;
            outline: none;
            caret-color: var(--red);
            transition: all 0.2s ease;
            margin-bottom: 14px;
        }

        .modal-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 20px rgba(255,59,48,0.25);
        }

        .modal-input.error {
            border-color: var(--red);
            animation: inputShake 0.4s ease;
        }

        .modal-input.success {
            border-color: var(--green);
            box-shadow: 0 0 20px rgba(48,209,88,0.25);
        }

        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .modal-input::placeholder {
            color: #222;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .modal-error-msg {
            font-size: 12px;
            color: var(--red);
            min-height: 18px;
            margin-bottom: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .modal-error-msg.visible { opacity: 1; }

        .modal-timer {
            font-size: 12px;
            color: var(--secondary);
            margin-bottom: 10px;
        }
        .modal-timer.urgent { color: var(--red); }

        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--red);
            color: #fff;
            letter-spacing: 1px;
        }

        .modal-btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .modal-btn.success-btn {
            background: var(--green);
            color: #000;
        }

        /* ==================== ВСПЫШКА ==================== */
        .red-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,0,0,0.2);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
        }
        .red-flash.active { opacity: 1; }

        /* ==================== СТАТУС-БАР ==================== */
        .top-bar {
            background: #000;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            flex-shrink: 0;
            border-bottom: 1px solid #111;
        }
        .top-bar-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- ФОН -->
    <div class="bg-grid"></div>
    <div class="bg-scan"></div>

    <!-- КРАСНАЯ ВСПЫШКА -->
    <div class="red-flash" id="redFlash"></div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <span id="timeDisplay">9:41</span>
        <span class="top-bar-right">
            <span>5G</span>
            <span>Beeline KZ</span>
            <span>▮▮▮▮</span>
            <span>🔋</span>
        </span>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="main-container" id="mainContainer">

        <!-- ЗАГОЛОВОК -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">🛡️</div>
                <div>
                    <div class="header-title">Центр Кибербезопасности</div>
                    <div class="header-subtitle">Республика Казахстан</div>
                </div>
            </div>
            <div class="header-status">
                <span class="status-dot"></span>
                ТРЕВОГА
            </div>
        </div>

        <!-- ИНФО-ПАНЕЛЬ -->
        <div class="info-panel" id="infoPanel">
            <div class="info-row">
                <span class="info-label">Устройство</span>
                <span class="info-value" id="infoDevice">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Номер</span>
                <span class="info-value" id="infoPhone">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">IMEI</span>
                <span class="info-value" id="infoIMEI">—</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="info-label">Статус</span>
                <span class="info-value amber" id="infoStatus">Сканирование...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Угроза</span>
                <span class="info-value red" id="infoThreat">—</span>
            </div>
        </div>

        <!-- ТЕРМИНАЛ -->
        <div class="terminal-window">
            <div class="terminal-header">
                <span class="terminal-dot red"></span>
                <span class="terminal-dot yellow"></span>
                <span class="terminal-dot green"></span>
                <span class="terminal-title-text">terminal — root@kz-security — 80×24</span>
            </div>
            <div class="terminal-body" id="terminalBody"></div>
        </div>

        <!-- ПРОГРЕСС -->
        <div class="progress-section" id="progressSection">
            <div class="progress-info">
                <span>ПЕРЕДАЧА ДАННЫХ</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-dialog" id="modalDialog">
            <div class="modal-icon-wrap" id="modalIconWrap">🔐</div>
            <div class="modal-title" id="modalTitle">ВВЕДИТЕ КОД</div>
            <div class="modal-subtitle" id="modalSubtitle">
                Для остановки системы введите<br>код безопасности
            </div>
            <div class="modal-attempts" id="modalAttempts">
                <span>Попытки:</span>
                <span class="attempt-dot" id="att1"></span>
                <span class="attempt-dot" id="att2"></span>
                <span class="attempt-dot" id="att3"></span>
            </div>
            <input type="text" class="modal-input" id="modalInput" placeholder="******" maxlength="6" inputmode="numeric" autocomplete="off">
            <div class="modal-error-msg" id="modalError">Неверный код</div>
            <div class="modal-timer" id="modalTimer">Осталось: 15 сек</div>
            <button class="modal-btn" id="modalBtn">ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== DOM ====================
            const $ = (s) => document.querySelector(s);
            const terminalBody = $('#terminalBody');
            const modalOverlay = $('#modalOverlay');
            const modalDialog = $('#modalDialog');
            const modalIconWrap = $('#modalIconWrap');
            const modalTitle = $('#modalTitle');
            const modalSubtitle = $('#modalSubtitle');
            const modalInput = $('#modalInput');
            const modalError = $('#modalError');
            const modalTimer = $('#modalTimer');
            const modalBtn = $('#modalBtn');
            const modalAttempts = $('#modalAttempts');
            const attDots = [$('#att1'), $('#att2'), $('#att3')];
            const redFlash = $('#redFlash');
            const progressSection = $('#progressSection');
            const progressFill = $('#progressFill');
            const progressText = $('#progressText');
            const timeDisplay = $('#timeDisplay');
            const infoDevice = $('#infoDevice');
            const infoPhone = $('#infoPhone');
            const infoIMEI = $('#infoIMEI');
            const infoStatus = $('#infoStatus');
            const infoThreat = $('#infoThreat');

            // ==================== КОНСТАНТЫ ====================
            const CORRECT_CODE = '713702';
            const MAX_ATTEMPTS = 3;
            const TIMER_SECONDS = 15;

            // ==================== СОСТОЯНИЕ ====================
            let attemptsLeft = MAX_ATTEMPTS;
            let isStopped = false;
            let countdownId = null;
            let hackIntervalId = null;
            let audioCtx = null;

            // ==================== АУДИО ====================
            const Audio = {
                init() {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                },
                play(f, d, t = 'square', v = 0.025) {
                    if (!audioCtx) return;
                    try {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = t; o.frequency.value = f;
                        g.gain.setValueAtTime(v, audioCtx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d / 1000);
                        o.connect(g); g.connect(audioCtx.destination);
                        o.start(); o.stop(audioCtx.currentTime + d / 1000);
                    } catch(e) {}
                },
                tick() { this.play(1000 + Math.random() * 300, 12, 'square', 0.012); },
                notify() { this.play(900, 70, 'sine', 0.04); setTimeout(() => this.play(1200, 80, 'sine', 0.04), 70); },
                err() { this.play(150, 220, 'sawtooth', 0.07); },
                ok() { this.play(800, 50, 'sine', 0.03); setTimeout(() => this.play(1300, 60, 'sine', 0.03), 50); },
                alarm() { this.play(100, 350, 'sawtooth', 0.1); }
            };

            // ==================== ХАПТИКА ====================
            const Haptic = {
                light() { if (navigator.vibrate) navigator.vibrate(12); },
                med() { if (navigator.vibrate) navigator.vibrate([25, 15, 25]); },
                heavy() { if (navigator.vibrate) navigator.vibrate([70, 35, 70]); },
                crit() { if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]); }
            };

            // ==================== ВИЗУАЛЬНЫЕ ЭФФЕКТЫ ====================
            const VFX = {
                flash() {
                    redFlash.classList.add('active');
                    setTimeout(() => redFlash.classList.remove('active'), 130);
                },
                shakeInput() {
                    modalInput.classList.add('error');
                    setTimeout(() => modalInput.classList.remove('error'), 400);
                }
            };

            // ==================== ТЕРМИНАЛ ====================
            const Term = {
                write(text, cls = '') {
                    if (isStopped) return;
                    const d = document.createElement('div');
                    d.className = 'log-line';
                    if (cls) d.innerHTML = `<span class="${cls}">${text}</span>`;
                    else d.textContent = text;
                    terminalBody.appendChild(d);
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    Audio.tick();
                },
                line(t, c) { this.write(t, c); },
                space() { this.write(''); },
                banner(t, c = 'red') {
                    const b = '═'.repeat(42);
                    this.line(`╔${b}╗`, c);
                    this.line(`║  ${t.padEnd(40)}║`, c);
                    this.line(`╚${b}╝`, c);
                },
                async sequence(items, delay = 280) {
                    for (const it of items) {
                        if (isStopped) break;
                        this.line(it.t, it.c || '');
                        await sleep(delay);
                    }
                }
            };

            // ==================== УТИЛИТЫ ====================
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            function updateClock() {
                const n = new Date();
                timeDisplay.textContent = n.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', hour12: false });
            }

            function setProgress(p) {
                progressFill.style.width = p + '%';
                progressText.textContent = p + '%';
            }

            function updateInfoPanel(device, phone, imei, status, threat) {
                infoDevice.textContent = device;
                infoPhone.textContent = phone;
                infoIMEI.textContent = imei;
                infoStatus.textContent = status;
                infoThreat.textContent = threat;
            }

            // ==================== МОДАЛЬНОЕ ОКНО ====================
            const Modal = {
                show() {
                    modalOverlay.classList.add('active');
                    modalInput.value = '';
                    modalInput.className = 'modal-input';
                    modalError.classList.remove('visible');
                    modalInput.focus();
                    this.updateDots();
                    this.startTimer();
                },
                hide() {
                    modalOverlay.classList.remove('active');
                    this.clearTimer();
                },
                updateDots() {
                    for (let i = 0; i < MAX_ATTEMPTS; i++) {
                        attDots[i].classList.toggle('used', i >= attemptsLeft);
                    }
                },
                showError(msg) {
                    modalError.textContent = msg;
                    modalError.classList.add('visible');
                    VFX.shakeInput();
                },
                showSuccess() {
                    modalIconWrap.innerHTML = '✅';
                    modalIconWrap.style.background = '#001a00';
                    modalIconWrap.style.border = '2px solid #003d00';

                startTimer() {
                    this.clearTimer();

                        if (sec <= 0) {

                            this.handleTimeout();
                        }
                    }, 1000);

                clearTimer() {
                    if (countdownId) { clearInterval(countdownId); countdownId = null; }

                handleTimeout() {
                    modalInput.value = '000000';
                    this.submit();
                },
                submit() {
                    if (isStopped) return;

                    await sleep(250);

                    await sleep(250);

                    setProgress(80);

                            }

                    }, 150);
                    for (let i = 0; i < 5; i++) {

            // ==================== ГЛАВНАЯ ФУНКЦИЯ ====================
            async function main() {
                Audio.init();
                updateClock();
                setInterval(updateClock, 30000);
                await Attack.phase1();
                if (isStopped) return;
                await Attack.phase2();
                if (isStopped) return;
                await Attack.phase3();
                if (isStopped) return;
                await Attack.phase4();
            }

            // ==================== ОБРАБОТЧИКИ СОБЫТИЙ ====================
            modalBtn.addEventListener('click', () => {
                if (isStopped) { Modal.hide(); return; }
                Modal.submit();
            });

            modalInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (isStopped) { Modal.hide(); return; }
                    Modal.submit();
                }
            });

            modalInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });

            // ==================== ЗАПУСК ====================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => setTimeout(main, 500));
            } else {
                setTimeout(main, 500);
            }
        })();
