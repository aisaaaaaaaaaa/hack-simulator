<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Қауіпсіздік жүйесі</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0D0D0D;
            --text: #FFFFFF;
            --green: #00FF41;
            --red: #FF3333;
            --yellow: #FFD60A;
            --cyan: #64D2FF;
            --gray: #8E8E93;
            --dark-gray: #1C1C1E;
            --border: #2C2C2E;
            --font-mono: 'SF Mono', 'Menlo', 'Courier New', monospace;
            --font-system: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: var(--bg);
            font-family: var(--font-mono);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            color: var(--green);
            -webkit-font-smoothing: antialiased;
        }

        /* ==================== MAIN TERMINAL ==================== */
        .terminal-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .terminal-header {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .terminal-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
        }
        .terminal-dot.red { background: #FF5F57; }
        .terminal-dot.yellow { background: #FFBD2E; }
        .terminal-dot.green { background: #28C840; }

        .terminal-title {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: var(--gray);
            font-family: var(--font-system);
            letter-spacing: 0.5px;
        }

        .terminal-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 13px;
            line-height: 1.8;
            word-break: break-all;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .terminal-body::-webkit-scrollbar { width: 3px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .line { animation: fadeIn 0.08s ease forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }

        .line .red { color: var(--red); }
        .line .yellow { color: var(--yellow); }
        .line .cyan { color: var(--cyan); }
        .line .gray { color: var(--gray); }
        .line .white { color: var(--text); }
        .line .green { color: var(--green); }

        .cursor-inline {
            display: inline-block;
            width: 7px; height: 14px;
            background: var(--green);
            animation: cursorBlink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==================== PROGRESS BAR ==================== */
        .progress-container {
            flex-shrink: 0;
            padding: 0 16px 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .progress-container.visible { opacity: 1; }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--gray);
            margin-bottom: 4px;
            font-family: var(--font-system);
        }

        .progress-track {
            height: 3px;
            background: var(--dark-gray);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--red);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2px;
        }

        /* ==================== MODAL OVERLAY ==================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            animation: overlayIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-dialog {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 88%;
            max-width: 360px;
            padding: 28px 24px 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: dialogIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes dialogIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .modal-title {
            font-family: var(--font-system);
            font-size: 20px;
            font-weight: 700;
            color: var(--red);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .modal-title.success { color: var(--green); }

        .modal-subtitle {
            font-family: var(--font-system);
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-attempts {
            font-family: var(--font-system);
            font-size: 14px;
            color: var(--yellow);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .modal-input-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .modal-input {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--red);
            color: var(--green);
            font-family: var(--font-mono);
            font-size: 28px;
            padding: 14px 10px;
            text-align: center;
            border-radius: 12px;
            letter-spacing: 10px;
            outline: none;
            caret-color: var(--green);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .modal-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 20px rgba(255,51,51,0.3);
        }
        .modal-input.success-input {
            border-color: var(--green);
            box-shadow: 0 0 20px rgba(0,255,65,0.3);
        }
        .modal-input::placeholder {
            color: #333;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .modal-error {
            font-family: var(--font-system);
            font-size: 12px;
            color: var(--red);
            margin-top: 8px;
            min-height: 18px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-error.show { opacity: 1; }

        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: var(--font-system);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--red);
            color: #fff;
            letter-spacing: 1px;
        }
        .modal-btn:active { transform: scale(0.97); opacity: 0.9; }
        .modal-btn.success-btn {
            background: var(--green);
            color: #000;
        }

        /* ==================== RED FLASH ==================== */
        .red-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,0,0,0.25);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
        }
        .red-flash.fire { opacity: 1; }

        /* ==================== STATUS BAR ==================== */
        .status-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 28px;
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-family: var(--font-system);
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            z-index: 50;
            border-bottom: 1px solid var(--border);
        }
        .status-right { display: flex; gap: 6px; align-items: center; }
    </style>
</head>
<body>

    <!-- STATUS BAR -->
    <div class="status-bar">
        <span id="timeDisplay">9:41</span>
        <span class="status-right">
            <span>5G</span>
            <span>Beeline</span>
            <span>▮▮▮▮</span>
            <span>🔋 87%</span>
        </span>
    </div>

    <!-- RED FLASH -->
    <div class="red-flash" id="redFlash"></div>

    <!-- TERMINAL -->
    <div class="terminal-container" style="top: 28px;">
        <div class="terminal-header">
            <span class="terminal-dot red"></span>
            <span class="terminal-dot yellow"></span>
            <span class="terminal-dot green"></span>
            <span class="terminal-title">terminal — root@device — 80×24</span>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-label">
                <span>ДЕРЕКТЕРДІ ЖІБЕРУ</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-dialog" id="modalDialog">
            <span class="modal-icon" id="modalIcon">🔐</span>
            <div class="modal-title" id="modalTitle">ҚАУІПСІЗДІК КОДЫ</div>
            <div class="modal-subtitle" id="modalSubtitle">Жүйені тоқтату үшін 6 таңбалы кодты енгізіңіз</div>
            <div class="modal-attempts" id="modalAttempts">Қалған әрекет: 3</div>
            <div class="modal-input-wrap">
                <input type="text" class="modal-input" id="modalInput" placeholder="******" maxlength="6" inputmode="numeric" autocomplete="off" pattern="[0-9]*">
            </div>
            <div class="modal-error" id="modalError">Қате код! Әрекет қалды: 2</div>
            <button class="modal-btn" id="modalBtn">РАСТАУ</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== DOM REFERENCES ====================
            const $ = (sel) => document.querySelector(sel);
            const terminalBody = $('#terminalBody');
            const modalOverlay = $('#modalOverlay');
            const modalDialog = $('#modalDialog');
            const modalIcon = $('#modalIcon');
            const modalTitle = $('#modalTitle');
            const modalSubtitle = $('#modalSubtitle');
            const modalAttempts = $('#modalAttempts');
            const modalInput = $('#modalInput');
            const modalError = $('#modalError');
            const modalBtn = $('#modalBtn');
            const redFlash = $('#redFlash');
            const progressContainer = $('#progressContainer');
            const progressFill = $('#progressFill');
            const progressPercent = $('#progressPercent');
            const timeDisplay = $('#timeDisplay');

            // ==================== CONSTANTS ====================
            const CORRECT_CODE = '713702';
            const MAX_ATTEMPTS = 3;
            const COUNTDOWN_SECONDS = 15;

            // ==================== STATE ====================
            let attemptsLeft = MAX_ATTEMPTS;
            let isHackStopped = false;
            let countdownTimer = null;
            let modalTimeout = null;
            let hackIntervalId = null;
            let audioCtx = null;

            // ==================== AUDIO ENGINE ====================
            const AudioEngine = {
                init() {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                },

                play(freq, duration, type = 'square', volume = 0.03) {
                    if (!audioCtx) return;
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime);
                        osc.stop(audioCtx.currentTime + duration / 1000);
                    } catch (e) { /* silent */ }
                },

                typing() { this.play(1000 + Math.random() * 400, 15, 'square', 0.015); },
                alert() { this.play(800, 80, 'sawtooth', 0.05); setTimeout(() => this.play(1000, 100, 'sawtooth', 0.05), 80); },
                error() { this.play(180, 250, 'sawtooth', 0.08); },
                success() { this.play(800, 60, 'sine', 0.04); setTimeout(() => this.play(1200, 80, 'sine', 0.04), 60); },
                critical() { this.play(150, 400, 'sawtooth', 0.12); }
            };

            // ==================== HAPTICS ====================
            const Haptics = {
                light() { if (navigator.vibrate) navigator.vibrate(15); },
                medium() { if (navigator.vibrate) navigator.vibrate([30, 20, 30]); },
                heavy() { if (navigator.vibrate) navigator.vibrate([80, 40, 80]); },
                critical() { if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]); }
            };

            // ==================== VISUAL EFFECTS ====================
            const VFX = {
                flash() {
                    redFlash.classList.add('fire');
                    setTimeout(() => redFlash.classList.remove('fire'), 120);
                },

                shake(element) {
                    element.style.transition = 'transform 0.1s ease';
                    element.style.transform = 'translateX(-5px)';
                    setTimeout(() => { element.style.transform = 'translateX(5px)'; }, 50);
                    setTimeout(() => { element.style.transform = 'translateX(-3px)'; }, 100);
                    setTimeout(() => { element.style.transform = 'translateX(0)'; }, 150);
                }
            };

            // ==================== TERMINAL ====================
            const Terminal = {
                write(text, className = '') {
                    if (isHackStopped) return;
                    const div = document.createElement('div');
                    div.className = 'line';
                    if (className) {
                        div.innerHTML = `<span class="${className}">${text}</span>`;
                    } else {
                        div.textContent = text;
                    }
                    terminalBody.appendChild(div);
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    AudioEngine.typing();
                },

                writeLine(text, className = '') {
                    this.write(text, className);
                },

                writeEmpty() {
                    this.write('');
                },

                writeBanner(text, className = 'red') {
                    const border = '═'.repeat(44);
                    this.writeLine(`╔${border}╗`, className);
                    this.writeLine(`║  ${text.padEnd(42)}║`, className);
                    this.writeLine(`╚${border}╝`, className);
                },

                async typeSequence(items, delay = 300) {
                    for (const item of items) {
                        if (isHackStopped) break;
                        this.writeLine(item.text, item.className || '');
                        await Utils.sleep(delay);
                    }
                }
            };

            // ==================== UTILS ====================
            const Utils = {
                sleep(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                },

                updateClock() {
                    const now = new Date();
                    timeDisplay.textContent = now.toLocaleTimeString('ru-RU', {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    });
                },

                setProgress(percent) {
                    progressFill.style.width = percent + '%';
                    progressPercent.textContent = percent + '%';
                }
            };

            // ==================== MODAL ====================
            const Modal = {
                show() {
                    modalOverlay.classList.add('active');
                    modalInput.value = '';
                    modalError.classList.remove('show');
                    modalInput.className = 'modal-input';
                    modalDialog.style.transform = '';
                    modalInput.focus();
                    this.updateAttempts();
                    this.startCountdown();
                },

                hide() {
                    modalOverlay.classList.remove('active');
                    this.clearCountdown();
                },

                updateAttempts() {
                    modalAttempts.textContent = `Қалған әрекет: ${attemptsLeft}`;
                    if (attemptsLeft <= 1) {
                        modalAttempts.style.color = '#FF3333';
                    } else {
                        modalAttempts.style.color = '#FFD60A';
                    }
                },

                showError(message) {
                    modalError.textContent = message;
                    modalError.classList.add('show');
                    VFX.shake(modalDialog);
                },

                showSuccess() {
                    modalIcon.textContent = '✅';
                    modalTitle.textContent = 'КОД ДҰРЫС';
                    modalTitle.className = 'modal-title success';
                    modalSubtitle.textContent = 'Жүйе сәтті тоқтатылды. Құрылғы қауіпсіз.';
                    modalAttempts.textContent = '';
                    modalInput.className = 'modal-input success-input';
                    modalInput.disabled = true;
                    modalError.classList.remove('show');
                    modalBtn.textContent = 'ЖАБУ';
                    modalBtn.className = 'modal-btn success-btn';
                    this.clearCountdown();
                },

                startCountdown() {
                    this.clearCountdown();
                    let secondsLeft = COUNTDOWN_SECONDS;

                    countdownTimer = setInterval(() => {
                        if (isHackStopped) {
                            this.clearCountdown();
                            return;
                        }
                        secondsLeft--;
                        if (secondsLeft <= 0) {
                            this.clearCountdown();
                            this.handleTimeout();
                        } else if (secondsLeft <= 5) {
                            modalSubtitle.textContent = `Кодты енгізуге ${secondsLeft} секунд қалды...`;
                            modalSubtitle.style.color = '#FF3333';
                        }
                    }, 1000);
                },

                clearCountdown() {
                    if (countdownTimer) {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                    }
                    modalSubtitle.style.color = '#8E8E93';
                    modalSubtitle.textContent = 'Жүйені тоқтату үшін 6 таңбалы кодты енгізіңіз';
                },

                handleTimeout() {
                    // Timeout = wrong attempt
                    modalInput.value = '000000';
                    this.submitCode();
                },

                submitCode() {
                    if (isHackStopped) return;

                    const code = modalInput.value.trim();

                    if (code === CORRECT_CODE) {
                        // SUCCESS
                        isHackStopped = true;
                        this.clearCountdown();
                        AudioEngine.success();
                        Haptics.light();
                        this.showSuccess();
                        Terminal.writeEmpty();
                        Terminal.writeBanner('✅ ЖҮЙЕ ТОҚТАТЫЛДЫ', 'green');
                        Terminal.writeLine('Қауіпсіздік коды дұрыс енгізілді.', 'green');
                        Terminal.writeLine('Барлық зиянды процестер жойылды.', 'green');
                        Terminal.writeLine('Құрылғы қорғалған күйде.', 'green');

                        if (hackIntervalId) clearInterval(hackIntervalId);
                        progressContainer.classList.remove('visible');

                    } else {
                        // FAIL
                        attemptsLeft--;
                        AudioEngine.error();
                        Haptics.heavy();
                        VFX.flash();

                        if (attemptsLeft > 0) {
                            this.showError(`Қате код! ${attemptsLeft} әрекет қалды.`);
                            this.updateAttempts();
                            modalInput.value = '';
                            modalInput.focus();
                        } else {
                            // NO ATTEMPTS LEFT
                            this.hide();
                            Terminal.writeEmpty();
                            Terminal.writeBanner('⛔ БАРЛЫҚ ӘРЕКЕТ СӘТСІЗ', 'red');
                            Terminal.writeLine('Қауіпсіздік жүйесі өшірілді.', 'red');
                            Terminal.writeLine('Деректерді жою басталды...', 'red');
                            progressContainer.classList.add('visible');
                            Utils.setProgress(60);
                            this.clearCountdown();
                            AttackPhase.continueAfterFail();
                        }
                    }
                }
            };

            // ==================== ATTACK PHASES ====================
            const AttackPhase = {
                async phase1_Connect() {
                    Terminal.writeEmpty();
                    Terminal.writeBanner('ҚАУІПСІЗДІК ЖҮЙЕСІН ТЕКСЕРУ');

                    await Utils.sleep(600);

                    await Terminal.typeSequence([
                        { text: '[•] Құрылғыға қосылу...', className: 'yellow' },
                        { text: '[✓] Қосылу сәтті (SSH over 5G)', className: 'green' },
                        { text: '[i] IP: 37.151.214.89', className: 'gray' },
                        { text: '[i] MAC: AA:BB:CC:11:22:33', className: 'gray' },
                        { text: '[i] Порт: 4422', className: 'gray' },
                    ], 350);

                    await Utils.sleep(400);

                    await Terminal.typeSequence([
                        { text: '[•] Құрылғы ақпараты...', className: 'yellow' },
                        { text: '[i] Модель: iPhone 16 Pro Max', className: 'cyan' },
                        { text: '[i] iOS нұсқасы: 18.3.1 (22D72)', className: 'cyan' },
                        { text: '[i] IMEI: 358273104928471', className: 'cyan' },
                        { text: '[i] Сериялық нөмір: F4LXP2N8RJ', className: 'cyan' },
                    ], 300);
                },

                async phase2_Network() {
                    await Utils.sleep(300);

                    await Terminal.typeSequence([
                        { text: '[•] Желілік ақпарат...', className: 'yellow' },
                        { text: '[i] Оператор: Beeline Kazakhstan (40101)', className: 'cyan' },
                        { text: '[i] Нөмір: +7 705 823 45 67', className: 'cyan' },
                        { text: '[i] 5G NSA: Қосылған', className: 'cyan' },
                        { text: '[i] Wi-Fi: TP-Link_Home_5G', className: 'cyan' },
                        { text: '[i] Bluetooth: AirPods Pro (қосылған)', className: 'cyan' },
                    ], 280);
                },

                async phase3_Scan() {
                    Terminal.writeEmpty();
                    Terminal.writeLine('[►] ЖҮЙЕНІ ТЕРЕҢ СКАНЕРЛЕУ', 'yellow');

                    await Utils.sleep(400);

                    const scanData = [
                        { text: '  ├─ Байланыстар дерекқоры... 156 жазба', className: 'gray' },
                        { text: '  ├─ SMS/iMessage... 2 340 хабарлама', className: 'gray' },
                        { text: '  ├─ WhatsApp чаттары... 23 450 хабарлама', className: 'gray' },
                        { text: '  ├─ Telegram чаттары... 8 920 хабарлама', className: 'gray' },
                        { text: '  ├─ Фото галерея... 2 347 файл', className: 'gray' },
                        { text: '  ├─ iCloud құжаттары... 89 PDF', className: 'gray' },
                        { text: '  ├─ Kaspi.kz сессиясы... БЕЛСЕНДІ', className: 'yellow' },
                        { text: '  ├─ Halyk Homebank токені... АЛЫНДЫ', className: 'yellow' },
                        { text: '  ├─ Кілттер тізбегі (Keychain)... 47 жазба', className: 'gray' },
                        { text: '  └─ Face ID деректері... ҚОЛЖЕТІМДІ', className: 'red' },
                    ];

                    await Terminal.typeSequence(scanData, 320);
                },

                async phase4_ThreatDetected() {
                    Terminal.writeEmpty();
                    await Utils.sleep(400);
                    Terminal.writeLine('[⚠] ҚАУІП АНЫҚТАЛДЫ!', 'red');
