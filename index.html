<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Қауіпсіздік жүйесі</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Courier New', 'Menlo', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            color: #0f0;
        }

        /* ОСНОВНОЙ ЭКРАН */
        .main {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        /* ТЕКСТ ВЗЛОМА */
        .log {
            flex: 1;
            font-size: 13px;
            line-height: 1.9;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log .red { color: #ff3333; }
        .log .yellow { color: #ffcc00; }
        .log .cyan { color: #00d4ff; }
        .log .gray { color: #666; }
        .log .white { color: #fff; }
        .log .green { color: #0f0; }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #0f0;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ОКНО ВВОДА КОДА */
        .code-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .code-overlay.active {
            display: flex;
        }

        .code-box {
            background: #0a0a0a;
            border: 2px solid #ff3333;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 0 40px rgba(255,0,0,0.3);
        }

        .code-box.success {
            border-color: #0f0;
            box-shadow: 0 0 40px rgba(0,255,0,0.3);
        }

        .code-title {
            color: #ff3333;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
        }

        .code-box.success .code-title {
            color: #0f0;
        }

        .code-subtitle {
            color: #999;
            font-size: 13px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .code-attempts {
            color: #ffcc00;
            font-size: 14px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .code-input {
            background: #000;
            border: 1px solid #ff3333;
            color: #0f0;
            font-size: 24px;
            padding: 12px;
            text-align: center;
            width: 100%;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            letter-spacing: 8px;
            outline: none;
            caret-color: #0f0;
        }

        .code-input::placeholder {
            color: #333;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .code-box.success .code-input {
            border-color: #0f0;
        }

        .code-btn {
            background: #ff3333;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 12px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            transition: background 0.2s;
        }

        .code-btn:active {
            background: #cc0000;
        }

        .code-box.success .code-btn {
            background: #0f0;
            color: #000;
        }

        .code-error {
            color: #ff3333;
            font-size: 12px;
            margin-top: 8px;
            display: none;
            font-family: 'Courier New', monospace;
        }

        .code-error.show {
            display: block;
        }

        /* КРАСНАЯ ВСПЫШКА */
        .flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,0,0,0.2);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .flash.on {
            opacity: 1;
        }

        /* ПРОГРЕСС БАР */
        .progress-wrap {
            width: 100%;
            height: 3px;
            background: #1a1a1a;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .progress-wrap.show {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: #ff3333;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <!-- КРАСНАЯ ВСПЫШКА -->
    <div class="flash" id="flash"></div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div class="main" id="main">
        <div class="log" id="logBox"></div>
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- ОКНО ВВОДА КОДА -->
    <div class="code-overlay" id="codeOverlay">
        <div class="code-box" id="codeBox">
            <div class="code-title" id="codeTitle">⚠️ ҚАУІПСІЗДІК КОДЫ</div>
            <div class="code-subtitle">Жүйені тоқтату үшін кодты енгізіңіз</div>
            <div class="code-attempts" id="codeAttempts">Қалған әрекет: 3</div>
            <input type="text" class="code-input" id="codeInput" placeholder="******" maxlength="6" inputmode="numeric" autocomplete="off">
            <button class="code-btn" id="codeBtn" onclick="checkCode()">РАСТАУ</button>
            <div class="code-error" id="codeError">Қате код! Қайтадан енгізіңіз.</div>
        </div>
    </div>

    <script>
        // ============ ПЕРЕМЕННЫЕ ============
        const logBox = document.getElementById('logBox');
        const codeOverlay = document.getElementById('codeOverlay');
        const codeBox = document.getElementById('codeBox');
        const codeTitle = document.getElementById('codeTitle');
        const codeAttempts = document.getElementById('codeAttempts');
        const codeInput = document.getElementById('codeInput');
        const codeBtn = document.getElementById('codeBtn');
        const codeError = document.getElementById('codeError');
        const flash = document.getElementById('flash');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');

        const CORRECT_CODE = '713702';
        let attemptsLeft = 3;
        let hackStopped = false;
        let hackInterval = null;

        // ============ АУДИО ============
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function beep(freq, dur, type = 'square', vol = 0.03) {
            if (!audioCtx) return;
            try {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type; o.frequency.value = freq; g.gain.value = vol;
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + dur / 1000);
            } catch(e) {}
        }

        function soundTyping() { beep(1000 + Math.random() * 300, 20, 'square', 0.02); }
        function soundAlert() { beep(800, 100, 'sawtooth', 0.06); setTimeout(() => beep(1000, 120, 'sawtooth', 0.06), 100); }
        function soundError() { beep(200, 300, 'sawtooth', 0.1); }
        function soundSuccess() { beep(800, 80, 'sine', 0.05); setTimeout(() => beep(1200, 100, 'sine', 0.05), 80); }

        function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

        // ============ ВСПЫШКА ============
        function doFlash() {
            flash.classList.add('on');
            setTimeout(() => flash.classList.remove('on'), 150);
        }

        // ============ ЛОГ ============
        function addLog(text, cls = '') {
            if (hackStopped) return;
            const span = document.createElement('span');
            span.className = cls;
            span.textContent = text;
            logBox.appendChild(span);
            logBox.scrollTop = logBox.scrollHeight;
            soundTyping();
        }

        function addLine(text, cls = '') {
            addLog(text + '\n', cls);
        }

        // ============ ПОКАЗАТЬ ОКНО ВВОДА ============
        function showCodeWindow() {
            codeOverlay.classList.add('active');
            codeInput.value = '';
            codeError.classList.remove('show');
            codeBox.classList.remove('success');
            codeTitle.textContent = '⚠️ ҚАУІПСІЗДІК КОДЫ';
            codeBtn.textContent = 'РАСТАУ';
            codeAttempts.textContent = `Қалған әрекет: ${attemptsLeft}`;
            codeInput.focus();
        }

        // ============ ПРОВЕРКА КОДА ============
        function checkCode() {
            const entered = codeInput.value.trim();

            if (entered === CORRECT_CODE) {
                // ПРАВИЛЬНЫЙ КОД - ОСТАНОВКА
                hackStopped = true;
                if (hackInterval) clearInterval(hackInterval);
                
                codeBox.classList.add('success');
                codeTitle.textContent = '✅ КОД ДҰРЫС';
                codeAttempts.textContent = 'Жүйе қалпына келтірілді';
                codeAttempts.style.color = '#0f0';
                codeBtn.textContent = 'ЖАБУ';
                codeBtn.style.background = '#0f0';
                codeBtn.style.color = '#000';
                codeBtn.onclick = function() {
                    codeOverlay.classList.remove('active');
                };
                codeError.classList.remove('show');
                codeInput.disabled = true;
                
                addLine('');
                addLine('═══════════════════════════════', 'green');
                addLine('ҚАУІПСІЗДІК КОДЫ ҚАБЫЛДАНДЫ', 'green');
                addLine('ЖҮЙЕ ТОҚТАТЫЛДЫ', 'green');
                addLine('БАРЛЫҚ ПРОЦЕСТЕР ЖОЙЫЛДЫ', 'green');
                addLine('ҚҰРЫЛҒЫ ҚАУІПСІЗ', 'green');
                addLine('═══════════════════════════════', 'green');
                
                soundSuccess();
                vibrate([50]);

            } else {
                // НЕПРАВИЛЬНЫЙ КОД
                attemptsLeft--;
                codeError.classList.add('show');
                codeInput.value = '';
                codeInput.focus();
                
                soundError();
                vibrate([100, 50, 100]);
                doFlash();

                if (attemptsLeft > 0) {
                    codeAttempts.textContent = `Қалған әрекет: ${attemptsLeft}`;
                    codeError.textContent = `Қате код! ${attemptsLeft} әрекет қалды.`;
                } else {
                    // КОНЧИЛИСЬ ПОПЫТКИ
                    codeOverlay.classList.remove('active');
                    addLine('');
                    addLine('═══════════════════════════════', 'red');
                    addLine('БАРЛЫҚ ӘРЕКЕТ СӘТСІЗ АЯҚТАЛДЫ', 'red');
                    addLine('ЖҮЙЕНІ ТОҚТАТУ МҮМКІН ЕМЕС', 'red');
                    addLine('ДЕРЕКТЕРДІ ЖОЮ ЖАЛҒАСУДА...', 'red');
                    addLine('═══════════════════════════════', 'red');
                    
                    progressWrap.classList.add('show');
                    progressFill.style.width = '60%';
                    
                    // Продолжаем взлом агрессивнее
                    setTimeout(continueHack, 1000);
                }
            }
        }

        // Ввод по Enter
        codeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkCode();
            }
        });

        // ============ ПРОДОЛЖЕНИЕ ВЗЛОМА ПОСЛЕ НЕУДАЧИ ============
        function continueHack() {
            progressFill.style.width = '80%';
            
            addLine('ҚАУІПСІЗДІК ЖҮЙЕСІ ӨШІРІЛДІ', 'red');
            addLine('БРАНДМАУЭР АЙНАЛЫП ӨТІЛДІ', 'red');
            addLine('');
            
            const finalData = [
                '📁 /sdcard/DCIM/ -> 2347 файл жүктелді',
                '📁 /data/contacts/ -> 156 байланыс',
                '📁 WhatsApp/ -> 23450 хабарлама',
                '📁 Telegram/ -> 8920 хабарлама',
                '💳 Kaspi Gold ****4732 -> 2 847 560 ₸',
                '💳 Halyk Bank ****8801 -> 1 230 000 ₸',
                '📍 Геолокация: Алматы, Абая 45',
                '📱 IMEI: 358273104928471',
                '📞 +7 705 823 45 67',
                '📞 +7 701 456 78 90',
                '📞 +7 702 345 67 89',
            ];

            finalData.forEach((item, i) => {
                setTimeout(() => {
                    if (!hackStopped) {
                        addLine(`  ├─ ${item}`, 'red');
                    }
                }, i * 300);
            });

            setTimeout(() => {
                if (!hackStopped) {
                    progressFill.style.width = '100%';
                    addLine('  └─ БАРЛЫҚ ДЕРЕКТЕР ЖІБЕРІЛДІ', 'red');
                    addLine('');
                    addLine('⚠️ ҚҰРЫЛҒЫ ТОЛЫҒЫМЕН БҰЗЫЛДЫ ⚠️', 'red');
                    addLine('СЕРВЕР: 185.117.153.79:9050 (TOR)', 'red');
                    addLine('');
                    
                    hackInterval = setInterval(() => {
                        if (!hackStopped) {
                            addLine('█', 'red');
                        }
                    }, 200);
                }
            }, finalData.length * 300 + 500);
        }

        // ============ ЗАПУСК ============
        async function startHack() {
            initAudio();

            // Фаза 1: Подключение
            addLine('', '');
            addLine('╔══════════════════════════════════════╗', 'red');
            addLine('║   ҚАУІПСІЗДІК ЖҮЙЕСІН ТЕКСЕРУ       ║', 'red');
            addLine('╚══════════════════════════════════════╝', 'red');
            await sleep(800);

            addLine('', '');
            addLine('[•] Құрылғыға қосылу...', 'yellow');
            await sleep(600);
            addLine('[✓] Қосылу сәтті', 'green');
            addLine('[•] IP: 192.168.1.107', 'gray');
            addLine('[•] MAC: AA:BB:CC:DD:EE:FF', 'gray');
            await sleep(500);

            addLine('[•] Құрылғы туралы ақпарат жинау...', 'yellow');
            await sleep(600);
            addLine('[i] Модель: iPhone 16 Pro Max', 'cyan');
            addLine('[i] iOS: 18.3.1', 'cyan');
            addLine('[i] IMEI: 358273104928471', 'cyan');
            await sleep(500);

            addLine('[•] Желі ақпараты...', 'yellow');
            await sleep(400);
            addLine('[i] Оператор: Beeline KZ', 'cyan');
            addLine('[i] Нөмір: +7 705 823 45 67', 'cyan');
            addLine('[i] 5G қосылған', 'cyan');
            await sleep(500);

            // Фаза 2: Сканирование
            addLine('', '');
            addLine('[►] ЖҮЙЕНІ СКАНЕРЛЕУ БАСТАЛДЫ', 'yellow');
            await sleep(400);

            const scanItems = [
                'Байланыстар дерекқоры... 156 жазба',
                'Хабарламалар... 2 340 SMS',
                'WhatsApp чаттары... 23 450 хабарлама',
                'Telegram чаттары... 8 920 хабарлама',
                'Галерея... 2 347 фото және видео',
                'Құжаттар... 89 PDF файл',
                'Kaspi.kz қосымшасы... сессия белсенді',
                'Halyk Homebank... токен алынды',
            ];

            for (const item of scanItems) {
                if (hackStopped) return;
                await sleep(350);
                addLine(`  ├─ ${item}`, 'gray');
            }
            addLine('  └─ Сканерлеу аяқталды', 'green');

            await sleep(600);

            // Фаза 3: Обнаружение угрозы
            addLine('', '');
            addLine('[⚠] ҚАУІП ТАБЫЛДЫ!', 'red');
            await sleep(400);
            addLine('[⚠] Рұқсатсыз кіру әрекеті анықталды', 'red');
            await sleep(300);
            addLine('[⚠] Деректердің жайылу қаупі: ЖОҒАРЫ', 'red');
            await sleep(500);

            addLine('', '');
            addLine('[!] ЖҮЙЕНІ ТОҚТАТУ ҮШІН ҚАУІПСІЗДІК КОДЫН ЕНГІЗІҢІЗ', 'yellow');
            addLine('[!] 3 ӘРЕКЕТ БЕРІЛЕДІ', 'yellow');
            await sleep(800);

            // Показываем окно ввода кода
            showCodeWindow();

            // Запускаем таймер обратного отсчёта (10 секунд на ввод)
            let countdown = 10;
            const countdownInterval = setInterval(() => {
                if (hackStopped || attemptsLeft <= 0) {
                    clearInterval(countdownInterval);
                    return;
                }
                countdown--;
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    if (!hackStopped && attemptsLeft > 0) {
                        // Время вышло - считаем как неправильную попытку
                        codeInput.value = '000000';
                        checkCode();
                    }
                }
            }, 1000);
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        // Запуск при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(startHack, 500);
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(startHack, 500);
        }
    </script>
</body>
</html>
